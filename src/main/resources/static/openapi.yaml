openapi: 3.0.3
info:
  title: Offer service
  version: 0.1.0
paths:
  /offer:
    get:
      summary: Get active, upcoming events and the definitions they use
      description: Evaluated at request time. An event is eligible at its exact start instant. Both calendar bounds are inclusive UTC dates.
      parameters:
        - {in: query, name: from, schema: {type: string, format: date}, description: First eligible UTC start date}
        - {in: query, name: to, schema: {type: string, format: date}, description: Last eligible UTC start date}
      responses:
        '200':
          description: Sorted offer. An empty offer contains three empty arrays.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '400':
          description: Invalid, blank or repeated date, or reversed range
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status: {type: integer}
                  detail: {type: string}
                  title: {type: string}
  /health/live:
    get:
      summary: Check that the HTTP service is running
      responses:
        '200': {description: Service is up}
  /health/ready:
    get:
      summary: Check completed startup and live listener assignments
      responses:
        '200': {description: Ready}
        '503': {description: Listener stopped or awaiting assignment}
components:
  schemas:
    Offer:
      type: object
      required: [events, markets, marketOutcomes]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/Event'}}
        markets: {type: array, items: {$ref: '#/components/schemas/Market'}}
        marketOutcomes: {type: array, items: {$ref: '#/components/schemas/MarketOutcome'}}
    Event:
      type: object
      required: [id, name, startsAt, markets]
      properties:
        id: {type: string}
        name: {type: string}
        startsAt: {type: string, format: date-time}
        markets: {type: array, items: {$ref: '#/components/schemas/EventMarket'}}
    EventMarket:
      type: object
      required: [id, marketId, outcomes]
      properties:
        id: {type: string}
        marketId: {type: string, description: References a market definition}
        outcomes: {type: array, items: {$ref: '#/components/schemas/EventMarketOutcome'}}
    EventMarketOutcome:
      type: object
      required: [id, outcomeId, odds]
      properties:
        id: {type: string}
        outcomeId: {type: string, description: References an outcome within the parent market definition}
        odds: {type: number, format: double}
    Market:
      type: object
      required: [id, name, outcomeIds]
      properties:
        id: {type: string}
        name: {type: string}
        outcomeIds: {type: array, items: {type: string}}
    MarketOutcome:
      type: object
      required: [marketId, id, name]
      properties:
        marketId: {type: string}
        id: {type: string}
        name: {type: string}
